# ==========================================================================
# RustDesk 自定义 Windows 客户端构建工作流（自包含，单平台 x64）
# --------------------------------------------------------------------------
# 放法：复制到你的 rustdesk fork 仓库的 .github/workflows/build-windows.yml
#
# 前置：无。服务器地址和 KEY 已写进 custom.json，工作流会自动读取它。
#       （高级可选）若想在 GitHub 里改值而不动代码，可再加 Secrets 覆盖：
#         RENDEZVOUS_SERVER / RS_PUB_KEY；不配也能正常构建。
#
# 依赖文件（需一并提交进 fork 根目录）：
#   apply_custom.py      （本工具包的补丁脚本）
#   custom.json          （已含你的服务器/KEY，工作流直接读取）
#   RustDesk.toml        （编译后随包附带，进一步隐藏设置项）
#
# 触发：打 tag 推送（git tag v1custom && git push --tags）或 Actions 页手动 Run
# 产物：运行完成后到 Artifacts 下载 rustdesk-windows（即自带服务器/KEY 的客户端）
# ==========================================================================
name: Build Custom RustDesk (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      # 1) 检出源码（含 hbb_common 子模块，config.rs 在其中）
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2) Python（补丁脚本用）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3) Rust 工具链（版本对齐官方，保证 crate 可编译）
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      # 4) LLVM（Rust FFI / bindgen 需要 libclang）
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      # 5) Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: false

      # 6) vcpkg（安装 libvpx/libyuv/opus/aom/ffmpeg/libsodium 等，由仓库 vcpkg.json 决定）
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      # 7) 让 bindgen/codegen 能找到 libclang
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$env:LLVM_HOME\lib" >> $env:GITHUB_ENV

      # 8) 应用定制补丁（内置服务器/KEY + 锁死 KEY + 精简界面）
      #    默认读取 custom.json（已含你的服务器/KEY）；若配了同名 Secrets 则优先用 Secrets
      - name: Apply custom patch (server/key + UI trim)
        run: |
          $cfg = Get-Content custom.json -Raw | ConvertFrom-Json
          $server = if ($env:RENDEZVOUS_SERVER) { $env:RENDEZVOUS_SERVER } else { $cfg.server }
          $key    = if ($env:RS_PUB_KEY)        { $env:RS_PUB_KEY }        else { $cfg.key }
          python apply_custom.py all --path . --server "$server" --key "$key"

      # 9) 生成 flutter_rust_bridge 代码（仓库未提交 generated_bridge.dart，必须生成）
      - name: Install flutter_rust_bridge codegen
        shell: bash
        run: |
          export LIBCLANG_PATH="$LLVM_HOME/lib"
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked

      - name: flutter pub get + generate bridge
        shell: bash
        run: |
          export LIBCLANG_PATH="$LLVM_HOME/lib"
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      # 10) 编译 Windows 客户端
      - name: Build rustdesk (Windows x64)
        shell: bash
        run: |
          export LIBCLANG_PATH="$LLVM_HOME/lib"
          python build.py --flutter --hwcodec --vram

      # 11) 附带 RustDesk.toml（进一步隐藏设置入口；不存在则跳过）
      - name: Bundle RustDesk.toml
        run: |
          if (Test-Path RustDesk.toml) {
            Copy-Item RustDesk.toml -Destination flutter/build/windows/x64/runner/Release/RustDesk.toml -Force
          }

      # 12) 上传产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows
          path: flutter/build/windows/x64/runner/Release/**
